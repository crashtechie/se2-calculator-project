version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    
    volumes:
      - ..:/workspace:cached
      - venv:/workspace/.venv
    
    command: sleep infinity
    
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=se2_calculator_dev
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - PYTHONUNBUFFERED=1
    
    depends_on:
      - db
    
    networks:
      - devcontainer

  db:
    image: postgres:17
    restart: unless-stopped
    
    volumes:
      - postgres-data:/var/lib/postgresql/data
    
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: se2_calculator_dev
    
    networks:
      - devcontainer

volumes:
  postgres-data:
  venv:

networks:
  devcontainer:
