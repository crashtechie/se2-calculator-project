name: Deploy Docker Stack
description: Build and deploy the full Docker stack (nginx + web + database)

steps:
  - name: Pre-Deployment Checks
    actions:
      - Verify .env file exists and is configured
      - Check DB_HOST=database in .env
      - Verify secrets are generated (SECRET_KEY, DB_PASSWORD)
      - Review docker-compose.yml configuration
      - Ensure no conflicting services on ports 80/5432

  - name: Build Images
    actions:
      - Run docker compose build
      - Review build output for errors
      - Verify all images built successfully
      - Check image sizes are reasonable

  - name: Start Services
    actions:
      - Run docker compose up -d
      - Wait for containers to start
      - Check container status (docker compose ps)
      - Verify all containers show "healthy"

  - name: Database Setup
    actions:
      - Wait for database health check
      - Run migrations (docker compose exec web python app/manage.py migrate)
      - Verify migrations applied successfully
      - Load fixtures if needed

  - name: Static Files
    actions:
      - Collect static files (docker compose exec web python app/manage.py collectstatic --no-input)
      - Verify static files in volume
      - Test static file serving via nginx

  - name: Health Checks
    actions:
      - Test nginx health (curl http://localhost/health/)
      - Test Django health endpoint
      - Verify database connectivity
      - Check all containers healthy

  - name: Create Superuser
    actions:
      - Run createsuperuser command
      - Set admin credentials
      - Test admin login

  - name: Smoke Tests
    actions:
      - Access homepage (http://localhost/)
      - Test navigation links
      - Verify CRUD operations work
      - Check static files load
      - Test database queries

  - name: Monitor Logs
    actions:
      - Check web logs for errors
      - Check nginx logs for issues
      - Check database logs
      - Verify no error messages

  - name: Backup Database
    actions:
      - Create initial backup
      - Test backup restoration
      - Document backup location

commands:
  build: "docker compose build"
  build_no_cache: "docker compose build --no-cache"
  up: "docker compose up -d"
  down: "docker compose down"
  restart: "docker compose restart"
  logs: "docker compose logs -f"
  ps: "docker compose ps"
  migrate: "docker compose exec web python app/manage.py migrate"
  collectstatic: "docker compose exec web python app/manage.py collectstatic --no-input"
  createsuperuser: "docker compose exec web python app/manage.py createsuperuser"
  loaddata: "docker compose exec web python app/manage.py loaddata sample_ores sample_components sample_blocks"
  shell: "docker compose exec web python app/manage.py shell"
  dbshell: "docker compose exec database psql -U se2_user -d se2_calculator"
  backup: "docker compose exec database pg_dump -U se2_user se2_calculator > backup_$(date +%Y%m%d_%H%M%S).sql"

troubleshooting:
  container_wont_start: "Check logs with 'docker compose logs <service>'"
  database_connection: "Verify DB_HOST=database and credentials match"
  static_files_404: "Run collectstatic and check nginx volume mounts"
  health_check_fail: "Check ALLOWED_HOSTS and application logs"
  port_conflict: "Check for services on ports 80/5432 with 'sudo lsof -i :80'"

checklist:
  - .env configured correctly
  - Secrets generated
  - Images built successfully
  - All containers healthy
  - Migrations applied
  - Static files collected
  - Health checks pass
  - Superuser created
  - Smoke tests pass
  - Logs show no errors
  - Backup created
