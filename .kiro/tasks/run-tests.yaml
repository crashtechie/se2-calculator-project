name: Run Test Suite
description: Execute tests with coverage and validation

steps:
  - name: Pre-Test Checks
    actions:
      - Ensure virtual environment is activated
      - Check all dependencies installed (uv sync)
      - Verify database is accessible
      - Check migrations are applied

  - name: Run Linting
    actions:
      - Run ruff check for code quality
      - Run ruff format --check for formatting
      - Fix any violations before testing

  - name: Run Unit Tests
    actions:
      - Execute pytest with coverage
      - Review test output for failures
      - Check for warnings or deprecations

  - name: Generate Coverage Report
    actions:
      - Generate HTML coverage report
      - Review coverage percentage (must be >80%)
      - Identify uncovered lines
      - Review coverage by app

  - name: Run Integration Tests
    actions:
      - Execute integration test suite
      - Verify full workflows work
      - Check resource chain calculations
      - Test cache behavior

  - name: Run Docker Tests
    actions:
      - Build Docker containers
      - Run health checks
      - Test database connectivity
      - Verify static files serving

  - name: Review Results
    actions:
      - Check all tests passed
      - Verify coverage threshold met
      - Review any skipped tests
      - Check for flaky tests

  - name: Fix Failures
    actions:
      - Debug failing tests
      - Fix code or update tests
      - Re-run affected tests
      - Verify fixes don't break other tests

commands:
  lint: "uv run ruff check . && uv run ruff format --check ."
  test: "uv run pytest --cov"
  test_verbose: "uv run pytest -v --cov"
  test_app: "uv run pytest app/{app}/tests/"
  coverage_html: "uv run pytest --cov --cov-report=html"
  test_specific: "uv run pytest app/{app}/tests/test_{file}.py"
  test_method: "uv run pytest app/{app}/tests/test_{file}.py::Test{Class}::test_{method}"
  docker_test: "docker compose up -d --build && docker compose exec web python app/manage.py test"

checklist:
  - Linting passes (ruff check)
  - Formatting correct (ruff format --check)
  - All tests pass
  - Coverage >80%
  - No warnings or deprecations
  - Integration tests pass
  - Docker tests pass
  - No flaky tests
